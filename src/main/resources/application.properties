spring.application.name=ctrip

logging.level.com.ctrip.user.service.StubSmsServiceImpl=DEBUG
logging.level.com.ctrip.user.service.StubEmailServiceImpl=DEBUG

# ===== 数据源 =====
# 敏感信息通过环境变量注入，本地开发可在 IDE 的 Run Configuration 中设置
spring.datasource.url=jdbc:mysql://localhost:3306/ctrip?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis Plus =====
# mapper-locations：XML 映射文件路径（如有自定义 SQL 则在此目录下创建同名 XML）
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.ctrip.user.entity
# type-enums-package：扫描 @EnumValue 枚举，自动完成枚举 ↔ 数据库值互转
mybatis-plus.type-enums-package=com.ctrip.**.entity.enums

# 开启驼峰映射：数据库 password_hash → Java passwordHash
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 关闭 SQL 日志（生产环境），开发调试时可改为 org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.id-type=auto

# ===== JWT =====
# JWT_SECRET：256-bit Base64 编码随机值，生产环境通过环境变量注入 // 目前是测试的jwt
app.jwt.secret=VGhpcyBpcyBhIHNlY3VyZSByYW5kb20ga2V5IGZvciBKV1Qgc2lnbmluZw==
# access token 有效期：15 分钟（单位：毫秒）
app.jwt.access-token-expiration-ms=900000
# refresh token 有效期：15 天（单位：毫秒）
app.jwt.refresh-token-expiration-ms=1296000000
app.jwt.issuer=ctrip

# ===== 限流（Bucket4j，认证端点，按 IP 计算）=====
# capacity：令牌桶容量；refill-tokens：每次补充数量；refill-duration-seconds：补充间隔（秒）
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-tokens=10
app.rate-limit.auth.refill-duration-seconds=60

# ===== 文件上传 =====
app.upload.dir=uploads/images
app.upload.base-url=/uploads/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ===== AI (DashScope / 通义千问) =====
# API key 获取：https://bailian.console.aliyun.com/
# 生产环境通过环境变量 AI_DASHSCOPE_API_KEY 注入
app.ai.dashscope.api-key=${AI_DASHSCOPE_API_KEY:sk-52bfa64d65ec484a86af0229e728a642}
app.ai.dashscope.model=qwen-plus
app.ai.dashscope.timeout-ms=25000
# AI 失败时是否回退到 mock 方案
app.ai.fallback-enabled=true

# ===== RabbitMQ =====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=30000
spring.rabbitmq.listener.simple.retry.multiplier=5
